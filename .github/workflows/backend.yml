name: backend

on:
  push:
  pull_request:

# Every step is one of the four commands documented in the README, run in the same order.
# No commit should be considered accepted if these fail.
jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # --locked fails if uv.lock is out of date with pyproject.toml, rather than
      # quietly resolving something different from what was tested locally.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Formatting
        run: uv run ruff format --check .

      # Bare `mypy` checks every package in pyproject's `files`: app, testing and
      # evaluation. Naming `app` here would have left the other two strict-checked only
      # when someone remembered to run it locally.
      - name: Type check
        run: uv run mypy

      - name: Tests
        run: uv run pytest -q
