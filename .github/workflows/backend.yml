name: backend

on:
  push:
  pull_request:

# Every step is one of the four commands documented in the README, run in the same order.
# No commit should be considered accepted if these fail (master plan section 56).
jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # --locked fails if uv.lock is out of date with pyproject.toml, rather than
      # quietly resolving something different from what was tested locally.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy app

      - name: Tests
        run: uv run pytest -q
