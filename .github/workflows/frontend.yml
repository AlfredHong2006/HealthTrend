name: frontend

on:
  push:
  pull_request:

# A separate workflow from backend.yml on purpose: the two run independently, so a frontend
# failure never blocks the backend job from reporting and vice versa, and each stays simple
# enough to read in one pass.
jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ci, not install: fails on a lockfile that does not match package.json, the same
      # role --locked plays in the backend workflow.
      - name: Install dependencies
        run: npm ci

      # backend/openapi.json is committed, so this needs no Python and no running server.
      # A diff here means a schema or route changed without regenerating the committed
      # TypeScript types (see docs/decisions/ADR-0008-frontend-contract-and-cors.md).
      - name: Check the generated API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code src/lib/api/schema.d.ts

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build
