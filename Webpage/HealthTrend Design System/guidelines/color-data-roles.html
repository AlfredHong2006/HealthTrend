<!-- @dsCard group="Colors" viewport="700x210" name="Data roles" subtitle="Colour encodes what a mark IS, never whether the number is good news." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head><body style="margin:0;background:var(--surface-page)"><div style="padding:22px 24px"><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:var(--space-6)"><div style="display:flex;flex-direction:column;gap:10px"><svg width="46" height="10"><line x1="0" y1="5" x2="46" y2="5" stroke="var(--data-trend)" stroke-width="2.25" stroke-linecap="round"/></svg><div class="ht-qualifier" style="color:var(--text-display)">Estimated trajectory</div><div class="ht-qualifier" style="font-family:var(--font-notation);font-size:10.5px">--data-trend</div></div><div style="display:flex;flex-direction:column;gap:10px"><svg width="46" height="16"><rect y="4" width="46" height="8" fill="var(--data-band-68)"/><rect width="46" height="16" fill="var(--data-band-95)"/></svg><div class="ht-qualifier" style="color:var(--text-display)">68% / 95% interval</div><div class="ht-qualifier" style="font-family:var(--font-notation);font-size:10.5px">--data-band-68 / 95</div></div><div style="display:flex;flex-direction:column;gap:10px"><svg width="46" height="10"><circle cx="6" cy="5" r="1.8" fill="var(--data-raw-fill)"/><circle cx="18" cy="5" r="1.8" fill="var(--data-raw-fill)"/><circle cx="30" cy="5" r="1.8" fill="var(--data-raw-fill)"/><circle cx="42" cy="5" r="1.8" fill="var(--data-raw-fill)"/></svg><div class="ht-qualifier" style="color:var(--text-display)">Raw measurements</div><div class="ht-qualifier" style="font-family:var(--font-notation);font-size:10.5px">--data-raw</div></div><div style="display:flex;flex-direction:column;gap:10px"><svg width="46" height="10"><line x1="0" y1="5" x2="46" y2="5" stroke="var(--data-projection)" stroke-width="1.75" stroke-dasharray="4 4"/></svg><div class="ht-qualifier" style="color:var(--text-display)">Projection</div><div class="ht-qualifier" style="font-family:var(--font-notation);font-size:10.5px">--data-projection</div></div><div style="display:flex;flex-direction:column;gap:10px"><svg width="46" height="10"><line x1="0" y1="5" x2="46" y2="5" stroke="var(--data-reference)" stroke-width="1" stroke-dasharray="3 3"/></svg><div class="ht-qualifier" style="color:var(--text-display)">User reference / goal</div><div class="ht-qualifier" style="font-family:var(--font-notation);font-size:10.5px">--data-reference</div></div></div><div class="ht-qualifier" style="margin-top:22px;max-width:none">No red/green anywhere: losing and gaining weight are drawn identically.</div></div></body></html>
