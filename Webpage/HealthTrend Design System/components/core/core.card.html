<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<body style="margin:0"><div id="root" style="padding:22px 24px"></div>
<script type="text/babel">
const { Button, IconButton, SegmentedControl, Select, Switch, Badge, TextLink, Tooltip, Icon } = window.HealthTrendDesignSystem_ec2bc0;
function Demo() {
  const [range, setRange] = React.useState('90d');
  const [tab, setTab] = React.useState('Trend');
  const [raw, setRaw] = React.useState(true);
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 22 }}>
      <div style={{ display: 'flex', gap: 12, alignItems: 'center', flexWrap: 'wrap' }}>
        <Button variant="primary" icon="plus">Log a weigh-in</Button>
        <Button variant="secondary" iconRight="download">Export CSV</Button>
        <Button variant="quiet" size="sm">Cancel</Button>
        <Button variant="secondary" size="sm" disabled>Disabled</Button>
        <IconButton icon="settings-2" label="Chart settings" />
        <IconButton icon="maximize-2" label="Expand" active />
      </div>
      <div style={{ display: 'flex', gap: 24, alignItems: 'center', flexWrap: 'wrap' }}>
        <SegmentedControl options={['30d','90d','1y','All']} value={range} onChange={setRange} />
        <SegmentedControl variant="underline" options={['Trend','Measurements','Method']} value={tab} onChange={setTab} />
      </div>
      <div style={{ display: 'flex', gap: 32, alignItems: 'flex-end', flexWrap: 'wrap' }}>
        <Select label="Smoothing window" options={['7 days','14 days','21 days','28 days']} value="14 days" />
        <Switch checked={raw} onChange={setRaw} label="Show raw measurements" hint="84 readings in range" />
        <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
          <Badge variant="accent">Kalman v2</Badge>
          <Badge variant="stale">Last reading 6 days ago</Badge>
          <Badge variant="outline">90d</Badge>
        </div>
      </div>
      <div style={{ display: 'flex', gap: 26, alignItems: 'center' }} className="ht-body">
        <span>Read the <TextLink>state-space model</TextLink> in full.</span>
        <TextLink variant="ui">Method section</TextLink>
        <Tooltip content="68% credible interval from the filter's posterior variance.">
          <span style={{ display: 'inline-flex', gap: 5, alignItems: 'center' }} className="ht-qualifier">
            <Icon name="info" size={13} /> hover for definition
          </span>
        </Tooltip>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script></body></html>
