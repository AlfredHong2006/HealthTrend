<script type="text/babel">
const { Prose, SectionHeading, TextLink } = window.HealthTrendDesignSystem_5b333a;
function App() {
  const [view, setView] = React.useState('trend');
  const [log, setLog] = React.useState(false);
  const goMethod = () => setView('method');
  return (
    <React.Fragment>
      <AppShell view={view} setView={setView} onLog={() => setLog(true)}>
        {view === 'trend' ? <TrendScreen goMethod={goMethod} /> : null}

        {view === 'evidence' ? <EvidenceScreen goMethod={goMethod} /> : null}
        {view === 'settings' ? <SettingsScreen /> : null}
        {view === 'method' ? (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 'var(--space-8)' }}>
            <SectionHeading eyebrow="Method" level={2}>The mathematics, in full</SectionHeading>
            <Prose>

          </div>
        ) : null}
      </AppShell>
      <LogWeighIn open={log} onClose={() => setLog(false)} />

}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
