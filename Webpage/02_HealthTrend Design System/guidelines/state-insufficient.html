<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="../_ds_bundle.js"></script></head>
<body style="margin:0"><div id="root" style="padding:22px 24px"></div>
<script type="text/babel">
function htSeries(len, start, wk, sd, seed, staleAfter) {
  let s = seed || 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const trend = [], raw = [];
  // Half-width has TWO terms: the warm-up narrows it as readings accumulate, and
  // days without a reading fan it back out. The trend line's slope is untouched
  // by the second term — gaps widen the band, they do not move the line.
  const warmUp = i => sd * (1 + 6 / (i + 6));
  for (let i = 0; i < len; i++) {
    const y = start + (wk / 7) * i;
    const gap = staleAfter != null && i > staleAfter ? i - staleAfter : 0;
    const hw = warmUp(gap ? staleAfter : i) * (1 + gap * 0.055);
    trend.push({ y, lo68: y - hw, hi68: y + hw, lo95: y - hw * 1.96, hi95: y + hw * 1.96, label: 'day ' + (i + 1) });
    if (i % 2 === 0 && !gap) raw.push({ i, y: y + (rnd() - 0.5) * 1.9 });
  }
  return { trend, raw };
}
const { InsufficientData, TrajectoryChart, ConfidenceNote } = window.HealthTrendDesignSystem_5b333a;
function Demo() {
  const s = htSeries(13, 82.2, -0.1, 0.6, 3);
  return (
    <div style={{ display: 'grid', gridTemplateColumns: '0.9fr 1.1fr', gap: 'var(--space-9)', alignItems: 'start' }}>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 'var(--space-6)' }}>
        <InsufficientData readings={5} needed={10} detail="the filter needs about two weeks" />
        <ConfidenceNote level="insufficient" />
      </div>
      <TrajectoryChart trend={s.trend} raw={s.raw} height={160} unit="kg"
        confidence="insufficient" showProjection={false} xTicks={[{ i: 0, label: 'Mon' }, { i: 6, label: 'Thu' }, { i: 12, label: 'Sun' }]} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
