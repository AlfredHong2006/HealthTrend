<!-- @dsCard group="Colors" viewport="700x180" name="Staleness, not judgement" subtitle="Amber describes the age or absence of DATA — never the body." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head><body style="margin:0;background:var(--surface-page)"><div style="padding:22px 24px"><div style="display:flex;gap:var(--space-9);align-items:flex-start"><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:56px;background:var(--amber-500);border:1px solid rgba(14,20,28,.07)"></div><div class="ht-qualifier" style="color:var(--text-display)">amber-500</div><div class="ht-qualifier" style="font-family:var(--font-notation);font-size:11px">#b07407</div></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:56px;background:var(--amber-100);border:1px solid rgba(14,20,28,.07)"></div><div class="ht-qualifier" style="color:var(--text-display)">amber-100</div><div class="ht-qualifier" style="font-family:var(--font-notation);font-size:11px">#fbf1de</div></div><div style="display:flex;flex-direction:column;gap:12px;padding-top:4px"><span style="display:inline-flex;align-items:center;height:19px;padding:0 6px;border-radius:3px;background:var(--surface-stale);color:var(--data-stale);font:600 12.5px var(--font-numeric)">Last reading 6 days ago</span><span class="ht-qualifier">Interval widening &mdash; 6 days without a measurement</span><span class="ht-qualifier" style="color:var(--ink-5)">Never: &ldquo;you gained weight&rdquo; in amber.</span></div></div></div></body></html>
