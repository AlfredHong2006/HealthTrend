<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head><body style="margin:0;background:var(--surface-page)"><div style="padding:22px 24px"><div style="display:flex;gap:var(--space-8);align-items:flex-end"><div style="display:flex;flex-direction:column;gap:8px;align-items:flex-start"><div style="width:120px;height:56px;background:var(--surface-page);border:1px solid var(--rule-2);border-radius:0px;box-shadow:none"></div><span class="ht-qualifier">radius-0 &middot; charts, tables, wells</span></div><div style="display:flex;flex-direction:column;gap:8px;align-items:flex-start"><div style="width:120px;height:56px;background:var(--surface-page);border:1px solid var(--rule-2);border-radius:3px;box-shadow:none"></div><span class="ht-qualifier">radius-1 &middot; controls</span></div><div style="display:flex;flex-direction:column;gap:8px;align-items:flex-start"><div style="width:120px;height:56px;background:var(--surface-page);border:1px solid var(--rule-2);border-radius:6px;box-shadow:var(--shadow-overlay)"></div><span class="ht-qualifier">radius-2 &middot; overlays</span></div><div style="display:flex;flex-direction:column;gap:8px;align-items:flex-start"><div style="width:120px;height:56px;background:var(--surface-page);border:1px solid var(--rule-2);border-radius:999px;box-shadow:none"></div><span class="ht-qualifier">radius-pill &middot; segmented track</span></div></div><div class="ht-qualifier" style="margin-top:18px;font-family:var(--font-notation);font-size:11px">one shadow token &middot; no inner shadows &middot; no glow &middot; no gradient fills</div></div></body></html>
