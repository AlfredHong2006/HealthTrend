<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head><body style="margin:0;background:var(--surface-page)"><div style="padding:22px 24px"><div style="display:flex;gap:var(--space-9)"><div style="display:flex;flex-direction:column;gap:6px"><span class="ht-qualifier" style="color:var(--text-display);font-family:var(--font-notation)">dur-1 90ms</span><span class="ht-qualifier">hover, press</span></div><div style="display:flex;flex-direction:column;gap:6px"><span class="ht-qualifier" style="color:var(--text-display);font-family:var(--font-notation)">dur-2 140ms</span><span class="ht-qualifier">control state, tooltip</span></div><div style="display:flex;flex-direction:column;gap:6px"><span class="ht-qualifier" style="color:var(--text-display);font-family:var(--font-notation)">dur-3 220ms</span><span class="ht-qualifier">panel reveal</span></div><div style="display:flex;flex-direction:column;gap:6px"><span class="ht-qualifier" style="color:var(--text-display);font-family:var(--font-notation)">dur-4 320ms</span><span class="ht-qualifier">chart re-scale on range change</span></div></div><div class="ht-qualifier" style="margin-top:20px">Easing: cubic-bezier(.2,0,.2,1). No bounce, no spring, no parallax, no entrance animation on data.</div></div></body></html>
