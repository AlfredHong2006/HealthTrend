# Alembic configuration for the HealthTrend account database.
#
# Run from backend/:
#
#     HEALTHTREND_DATABASE_URL=postgresql+psycopg://... uv run alembic upgrade head
#
# No database URL is written here: it is a credential, so it is read from
# HEALTHTREND_DATABASE_URL by alembic/env.py. No logging configuration either -- a migration
# prints nothing about the data it touches, and none of it is health data anyway.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
